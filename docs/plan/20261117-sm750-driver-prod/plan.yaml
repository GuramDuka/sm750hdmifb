  - "T28 acceptance (2026-11-19, closing the tier-4/tier-5 path opened by T26): the CRC source was unreachable from userspace because the driver installed its callbacks too late. drm_simple_display_pipe_init() at src/sm750_drm.c:3723 creates the CRTC with the simple-pipe funcs, and only src/sm750_drm.c:3731 assigns sdev->pipe.crtc.funcs = &sm750_crtc_funcs, so DRM never saw .get_crc_sources, .verify_crc_source or .set_crc_source and never created /sys/kernel/debug/dri/N/crtc-0/crc/. Repairing that through DRM is impossible from a module: /usr/src/kernels/7.3.4-100.fc43.x86_64/Module.symvers exports drm_crtc_add_crc_entry (EXPORT_SYMBOL_GPL) but not drm_debugfs_crtc_crc_add (the drm_debugfs exports are drm_debugfs_gpuva_info, drm_debugfs_create_files, drm_debugfs_remove_files, drm_debugfs_add_file, drm_debugfs_add_files). Rejected alternative: create the CRTC with drm_crtc_init_with_planes and drm_universal_plane_init instead of drm_simple_display_pipe_init - invasive, and the driver relies on pipe and pipe->crtc throughout. Chosen remedy: the driver hosts the three files itself from sm750_regs_debugfs_add() at src/sm750_drm.c:3607 via a new .late_register callback, creating crtc-<index>/crc/source (0444, scanout), crc/control (read/write, none or empty disables, auto or scanout enables) and crc/data. The arm/disarm path is shared with the existing vblank work rather than duplicated, entries go to both the 128-slot ring (SM750_CRC_ENTRIES at src/sm750_drm.c:290) and drm_crc_add_crc_entry() from one computation, data supports blocking read, O_NONBLOCK -EAGAIN, single reader -EBUSY and poll, and everything sits inside the 7.0 version guard, so the 6.17 floor is unaffected. Review finding, fixed before acceptance: the first implementation emitted 0x%08x 0x%08x per entry and no leading count line, which libdrm and IGT would have discarded - igt_pipe_crc reads exactly one line first and parses it with %d as the values-per-entry count, then parses entries with %u %x, so a 0x-prefixed first line parses as 0. The format is now the DRM contract: SM750_CRC_COUNT_LINE \"1\\n\" at src/sm750_drm.c:292 emitted once per open behind crc_count_sent (:3335-:3343, reset in sm750_crc_data_open), entry lines scnprintf(\"%u %08x\\n\") at src/sm750_drm.c:3362 with a decimal vblank frame counter and no 0x prefix, and SM750_CRC_LINE_LEN 20 at :294 so a short read returns -EINVAL as DRM does. tests/check-crc-uapi.sh (106 lines, called from tests/check-drm-policy.sh so the check: recipe stays exactly 17 commands) asserts the three callbacks, the three file names, the count-line gate, the exact entry format, the absence of 0x in the data path and the 128-entry ring, and it rejects six planted defects with distinct messages (deleted .set_crc_source, control renamed to ctl, count-line gate removed, field order swapped, 0x prefix added, ring depth halved). Four kernel builds (7.2.15-100, 7.3.3-100, 7.3.4-100, 6.17.1-300) exit 0 and every gate exits 0 (make check, check-release-version, check-drm-packaging, check-static, check-crc-uapi, check-drm-policy, make crc-check); docs/evidence/scanout/05-crc-debugfs-build.txt carries the builds plus the uapi contract paragraph and 06-crc-debugfs-runtime.txt stays an honest SKIP. Runtime proof is still owed: one root run of tests/check-scanout-crc.sh on a module rebuilt and reloaded from this tree, which is the only remaining blocker for AC-3 tiers 4 and 5. Version stays 0.6.0; 0.6.1 is reserved for the build that carries the transcript."

