      - "The reproduction shape (SIGINT a kmscube ~300 ms into its first commit, then `modetest -s 35@38:1024x768-60`) is run at least 36 times on the fixed module with zero WARN_ON, zero 'commit wait timed out' and zero refcount underflow; if any attempt still warns, the attempt's dmesg window is captured and the task returns needs_revision instead of claiming success."
