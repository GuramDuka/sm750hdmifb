      blend-mode handling anywhere in src/. The driver then converts the ARGB cursor into a
      3-entry palette itself (sm750_cursor_atomic_update at :2769, palette[3] at :2784), so
      the kernel's expectation about how alpha is expressed does not match what the driver
      does.
