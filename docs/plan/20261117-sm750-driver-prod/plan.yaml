  - id: T22
    title: Remove stale DKMS versions of the same package, and stop the spec from leaving them behind
    description: |
      Rung: packaging defect found on the host, fix at the source. The host still has
      sm750hdmifb/0.5.9 registered as "built" for 7.3.3-100 and 7.3.4-100, with
      /var/lib/dkms/sm750hdmifb/0.5.9 holding two built sm750hdmidrm.ko.xz and a source
      symlink to the 21 MB orphan /usr/src/sm750hdmifb-0.5.9. 0.5.9 is not installed and
      not loaded (every /lib/modules/*/extra/sm750hdmidrm.ko.xz is 0.6.0), but both versions
      declare DEST_MODULE_LOCATION[0]="/updates/dkms", which dkms on Fedora rewrites to
      /extra, so the two registrations share one destination filename. dkms autoinstall
      only installs the newest registered version, so the stale entry is harmless while
      0.6.0 stays registered - and becomes a silent revert to the pre-fix driver the moment
      0.6.0 is unregistered, on the next kernel install. Make the package remove every other
      registered version of its own DKMS module name, and prove it on the live host.
    wave: 10
    depends_on: [T6, T20]
    agent: gem-devops
    status: completed
    retries_used: 0
    acceptance_criteria:
      - "packaging/sm750hdmifb.spec gains a bounded purge of stale registrations: for every `dkms status` line whose module name is %{dkms_name} and whose version is not %{dkms_version}, run `dkms remove -m %{dkms_name} -v <that version> --all`, ignoring failures with a warning; the block must be idempotent, must never run when the same version is registered, and must not touch any other module name."
      - "The purge runs in %posttrans after the kernel build loop (not in %post), and the existing %preun/%postun design is preserved: %preun still removes %{dkms_version} only when $1 -eq 0, and no %postun is added."
      - "tests/check-rpm-dkms.sh asserts the purge block exists, is scoped to %{dkms_name}, excludes %{dkms_version}, and exits non-zero if a future edit drops it; `make check` still exits 0 with the unchanged 17 command recipe of the check target."
      - "The rebuilt RPM at the same 0.6.0-1 NEVRA is installed with the allowlisted pair (`sudo -n dnf remove -y sm750hdmifb` then `sudo -n dnf install -y /mega/tmp/sm750/t6/rpmbuild/RPMS/noarch/sm750hdmifb-0.6.0-1.fc43.noarch.rpm`) and afterwards `sudo -n dkms status` lists exactly one version, 0.6.0 installed for every kernel, with the 0.5.9 rows gone."
      - "The module still loads after the cycle: `/sys/module/sm750hdmidrm/version` reads 0.6.0 and `sudo -n /usr/local/sbin/sm750-regs` exits 0 with its 49-register dump."
      - "docs/PACKAGING-RPM.md documents the purge (why the destination-path collision is real, what the block does, what it deliberately leaves alone) and the residual manual step for the orphan /usr/src/sm750hdmifb-0.5.9 directory, which dkms does not delete."
      - "Evidence docs/evidence/runtime/22-dkms-stale-purge.txt with a `# utc:` header holds the before/after `dkms status`, the dnf transaction output and the post-cycle module checks; one LOGBOOK entry records the defect, the fix and the verification."
    handoff:
      constraints:
        - "No src/ change. This is packaging and scriptlet only; if a driver fix looks necessary, record it as a defect row instead."
        - "Use only the already-allowlisted install pair; request no new privilege and add no sudoers entry."
        - "Do not delete /usr/src trees from the spec; RPM must not remove directories it does not own. The orphan directory is documented as a manual step."
        - "T20 may still be building in /mega/tmp/sm750/t20/tree - build in your own copy under /mega/tmp/sm750/t22/tree and never run make/rpmbuild in /home/coder/sm750hdmifb."
      relevant_context:
        - "Hazard mechanism: both dkms.conf files declare DEST_MODULE_LOCATION[0] as /updates/dkms; /usr/sbin/dkms override_dest_module_location() maps that to /extra on fedora/centos/rhel, so 0.5.9 and 0.6.0 both target /lib/modules/<kver>/extra/sm750hdmidrm.ko.xz."
        - "/usr/sbin/dkms autoinstall() installs only the newest version per module name (latest[$m] via VER comparison) and skips kernels where _is_module_installed is already true; dkms.service is enabled and active with ExecStart=/usr/bin/dkms autoinstall --verbose --kernelver %v, so a kernel install is the trigger."
        - "Current host state: dkms status = 0.5.9 built on 7.3.3-100 and 7.3.4-100, 0.6.0 installed on 7.2.15-100 / 7.3.3-100 / 7.3.4-100; rpm -ql sm750hdmifb matches no 0.5.9 path, so /usr/src/sm750hdmifb-0.5.9 is an orphan predating packaging."
        - "Check target recipe is 17 commands (Makefile:30-48) and tests/check-drm-module.sh asserts the count; tests/check-rpm-dkms.sh already inspects the scriptlet text with rpm -qp --scripts."
      plan_context:
        tech_stack: ["Fedora 43", "RPM 4.x", "dkms 3.x", "kernel 7.3.4-100.fc43.x86_64"]
        architectural_boundaries: ["packaging/sm750hdmifb.spec owns dkms registration lifecycle", "src/ is out of scope for this task"]
        risk_decisions: ["The stale 0.5.9 registration is a packaging defect, not a driver defect; fix it in the scriptlets so a fresh machine can never reproduce it"]

