      trips WARN_ON(new_crtc_state->event), the commit never completes, three 10 s waits time out
      and a later drm_release can underflow a refcount. Make the fail path terminal: the commit
      must finish and vblank accounting must be re-enabled on every exit from sm750_pipe_enable.
      No behaviour change on the success path. Rebuild, and rebuild the RPM at the SAME NEVRA so
      the existing allowlisted dnf remove/install pair can carry it to the running kernel.
    wave: 10
