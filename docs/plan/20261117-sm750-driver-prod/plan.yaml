acceptance_criteria:
  - "AC-1 Device specifications located, read and archived: docs/specs/INDEX.md carries source URL, version, date and SHA-256 for the SM750 datasheet and product brief; docs/specs/REGISTER-MAP.md cross-references every MMIO register used by src/*.c; unresolved items are listed in docs/specs/GAPS.md; no vendor binaries enter the tree."
  - "AC-2 Repository audit and defect inventory: docs/AUDIT.md records every defect with severity and evidence, and docs/DEFECTS.md gives each one a status of fixed, accepted or deferred with justification."
  - "AC-3 Runtime and hardware validation ladder: connector state -> modetest enumeration -> modeset -> framebuffer readback -> scanout CRC -> external capture, each tier backed by an evidence path; tiers that could not be reached are GAP rows with closing commands."
  - "AC-4 Test strategy and results: docs/TEST-STRATEGY.md names the in-repo and external suites, and every PASS row is backed by an evidence file that exists in the tree."
  - "AC-5 Build integrity: make check green (17 recipe commands), build matrix covering the declared 6.17 floor plus the installed 7.2/7.3 header trees, and no compiler warnings originating in src/."
  - "AC-6 Packaging: an rpmbuild spec produces a noarch DKMS source carrier with correct scriptlets and dependencies, verified rootless (rpmbuild -ba, rpm -qp --scripts, rpm -qlp, rpm -qpR, dkms sandbox status built); root-only install and erase are documented gaps with exact closing commands."
  - "AC-7 Deliverable index and clean-checkout reproduction: docs/DELIVERABLES.md maps AC-1..AC-7 to repo paths and verification commands, README documents the RPM/DKMS path, and every root-only step is labelled with its closing command."

tasks:
  - id: T1
    title: Archive SM750 device specifications with checksums and authority index
    description: |
      Rung: new artifact (no in-repo spec archive exists). Locate and cite the
      authoritative SM750 documents, record URL/version/date/SHA-256, and cross-reference
      register and mode definitions against the driver. Third-party binaries stay out of
      the tree; only the index, checksums and authored cross-reference tables are
      committed. Enforce the degradable-gate fallback ladder; record every gap instead of
      blocking.
    wave: 1
    depends_on: []
    agent: gem-researcher
    exploration_mode: question
    context_cluster: audit-context
    status: completed
    retries_used: 0
    acceptance_criteria:
      - "docs/specs/INDEX.md records for the SM750 datasheet and the SM750 product brief: source URL, document version and date, retrieval date, and SHA-256 of the downloaded file; each checksum is reproducible by the documented re-download-and-hash command."
      - "No third-party binary document is committed: `git ls-files docs/specs` lists only text artifacts (INDEX.md, SHA256SUMS, GAPS.md and authored cross-reference files), keeping docs/PROVENANCE.md:47 true and keeping vendor PDFs out of the build-package.sh source tarball."
      - "docs/specs/INDEX.md classifies each source as authoritative vs vendor-supplied vs substitute and states which fallback rung was used per document."
      - "Coverage table maps display controller, mode/clock tables, DMA engine, GPIO/I2C (SiI9024 control bus) and cursor registers to a cited document section or to a named substitute source."
      - "Cross-check of src/ddk750_reg.h against the cited sources lists every register used by the driver without a citation, each with file:line."
      - "If a document is unobtainable, docs/specs/GAPS.md records the exact URL/attempt, the substitute used, and states that the stage is not blocked."
    handoff:
      constraints:
        - "Known existing source URLs in docs/HARDWARE.md:59 (SM750 product brief, siliconmotion.com) and docs/HARDWARE.md:60 (SM750 datasheet v1.4, VersaLogic)."
        - "Download to /mega/tmp/sm750 for hashing; never commit the PDFs."
        - "No writes outside docs/specs/."
        - "Treat documented boundary/count/completion semantics as hypotheses; docs/HARDWARE.md:23 records a case where the spec is wrong."
      relevant_context:
        - "docs/PROVENANCE.md asserts DDK files originate from Linux staging sm750fb; that tree is the first substitute for register semantics."
        - "Driver source: src/ddk750_reg.h, src/ddk750_mode.c, src/ddk750_display.c, src/ddk750_hwi2c.c, src/ddk750_swi2c.c, src/sii902x.c."
        - "Reviewer-verified: tests/audit-release.sh:54 greps for 'all rights reserved|confidential' and does not trip on these PDFs, so provenance consistency is the only concern."
      high_risk_signals:
        - "Spec/behavior divergence already proven (docs/HARDWARE.md:23); do not let spec text override validated workarounds."
      critic_signals: []

  - id: T2
    title: Audit repo state and produce severity-ranked defect inventory
    description: |
      Rung: reuse existing sources; no code changes. Establish executable ground truth
      for layout, build system, declared kernel range, packaging state and current test
      status under rootless conditions, then enumerate defects with reproduction commands.
      This inventory is the input to the fix task and the acceptance review.
    wave: 1
    depends_on: []
    agent: gem-researcher
    exploration_mode: audit
    context_cluster: audit-context
    status: completed
    retries_used: 0
    acceptance_criteria:
      - "docs/AUDIT.md records HEAD sha, branch, remotes, worktree cleanliness, source file count/LOC, module identity (sm750hdmidrm) vs package identity (sm750hdmifb 0.5.9), and every build/package entry point (Makefile targets, build-package.sh, dkms.conf, .github/workflows/build.yml) with file:line references."
      - "Declared kernel support range is stated with evidence from dkms.conf BUILD_EXCLUSIVE_KERNEL, README.md kernel-compatibility section and tests/build-all-kernels.sh version case, and contrasted with the handoff claim of 5.14."
      - "docs/AUDIT.md defect table has IDs, severity S1-S4, symptom, reproduction command and observed evidence; it includes at minimum: no rpmbuild spec anywhere, make check requiring libdrm which is absent from the host, no archived specifications, absent igt/kmscube, gcc 14.4.1 vs kernel gcc 15.3.1 mismatch, no installed 6.17 header tree, and no register-dump facility in the driver."
