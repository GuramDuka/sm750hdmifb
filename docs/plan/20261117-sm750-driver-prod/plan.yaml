oves 115 -> 116. build-package.sh:127 drops .github from the tar argument list because tar fails on a path absent from a fresh clone. Gates after the change: check-release-version.sh exit 0 'Release version consistency checks passed: 0.6.0'; check-drm-packaging.sh exit 0; make CC=/usr/bin/gcc check exit 0 'Ran 4 tests ... OK'; check-rpm-dkms.sh exit 0 'RPM/DKMS checks passed ... sandbox built, root-only steps skipped' with 8 SKIP lines; build-package.sh exit 0 then audit-release.sh exit 0 'Release audit passed'. The pre-existing dist tarball was stale and made the audit fail with 'Source archive does not match the tracked tree.' until it was rebuilt; final archive is 116 entries with exactly one under docs/ci/ and none matching .github, against 218 tracked files and a 116-file payload. Makefile untouched, check: recipe still 17 commands."

