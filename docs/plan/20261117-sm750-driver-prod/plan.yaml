  - "Fedora 43 is the primary RPM target; the spec stays EL9-portable where macros allow (portable equivalents preferred, EL9 divergences as in-spec comments, not blockers). Kernel floor stays 6.17 from dkms.conf BUILD_EXCLUSIVE_KERNEL."
  - "No atomic DRM/KMS rewrite: the driver already registers a DRM/KMS device with drm_vram_helper/ttm (modinfo: 'Atomic DRM/KMS driver for SM750G10 SiI9024A HDMI boards'); rewrite only if a specific defect provably requires it (none identified at plan time)."
  - "Kernel matrix is the declared 6.17 floor through 7.x (dkms.conf BUILD_EXCLUSIVE_KERNEL, README, tests/build-all-kernels.sh), not 5.14; verification uses installed header trees 7.2.13-100, 7.2.15-100, 7.3.3-100 plus the extracted 6.17.1-300 tree."
  - "Spec-archive stage is a degradable gate, never a blocker: fallback ladder is public SM750/SM718 datasheet+product brief, then register/mode definitions in mainline drivers/video/fbdev/sm750 (and drivers/staging/sm750fb) headers, then any locally present vendor SDK headers. Only a register-level unknown provably unresolved for a specific fix may block that fix."
