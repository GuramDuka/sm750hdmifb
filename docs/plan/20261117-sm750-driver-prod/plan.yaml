  - "Kernel floor remains 6.17 per dkms.conf BUILD_EXCLUSIVE_KERNEL; the EL9 portability target does not lower it, so EL9 kernels below 6.17 are documented as unsupported in the spec comment rather than accommodated."
  - "No privileges are available: sudo -n permits only /usr/bin/dmidecode, /usr/local/cuda/bin/ncu and /usr/local/cuda/bin/nvprof; id reports groups=1006(coder) only; /dev/dri/card0 ACL grants user:duka:rw-; python3 open('/dev/dri/card0') raises PermissionError [Errno 13]; modetest -c prints 'no device found'; dmesg is denied; /sys/bus/pci/devices/0000:01:00.0/rom is unreadable; dkms install fails 'Error! You must be root to use this command.'; rpm -i --root= fails 'Unable to change root directory'."
  - "A second user decision on rootless-vs-wait is still pending; this plan is written so it is correct either way, because the privilege-upgrade path is additive and does not change task ownership or wave order."
  - "Repo is a fork (origin polaris.root.sx, upstream github.com/KodeMunkie/sm750hdmifb) at HEAD 27db03b on main, clean worktree; committed evidence files are acceptable deliverables."
  - "Scratch-path constraint (user, 2026-11-17): all intermediate and temporary files use /mega/tmp/, /mnt/INTEL_SSDSC2KB019T8_PHYF238503BW1P9DGN/tmp/ or /mnt/INTEL_SSDSC2KB038T8_PHYF320200Y73P8EGN/tmp/ (scratch root /mega/tmp/sm750/); nothing is written to the project worktree except committed deliverables and nothing to the user's home directory."

