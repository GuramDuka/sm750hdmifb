    agent: gem-implementer
    status: completed
    retries_used: 0
    acceptance_criteria:
      - "src/sm750_drm.c sm750_pipe_enable: every return path after the point of no return either completes the modeset or explicitly drops new_crtc_state->event and calls drm_crtc_vblank_on(), so commit_hw_done can never see a non-NULL event on a commit the driver abandoned; the success path at :3101-3102 is unchanged."
      - "The three 10 s 'commit wait timed out' reports and the refcount underflow reported in A27 cannot be produced by the same cascade: the fix removes the event-without-arm window, and a code walk in the report shows why no remaining path returns while the event is still armed."
