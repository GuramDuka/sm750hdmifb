  - "T25 execution-trace harness (2026-11-19, follow-up to the VBIOS study): the reconstruction was verified byte-wise only, so a behavioural check was added as opt-in tooling. tools/vbios-re/trace.sh plus tools/vbios-re/trace.py trace the option ROM by execution from CS=0xc000 IP=0x1256 on two engines - qemu-system-i386 with -device loader,file=...,addr=0xc0000,force-raw=on and a gdb single-step loop, and unicorn 2.1.4 with instruction and IN/OUT hooks - then diff the captured image against the rebuilt one from the same reset state. Measured: 2000 steps each, identical instruction streams on both engines, 198 identical port events under unicorn (out=99 in=99 on 0xcf8/0xcfc), entry into the PCI helper at 0xc6065 at step 5. Non-vacuity proved by a one-byte mutation at file offset 0x125a, which both engines report as DIVERGED at step 1 with exit 1. -option-rom remains unusable because QEMU requires 55 aa at the end of a 512-byte block and this image has none. Limits recorded in the document: no emulated machine has an SM750, so the trace is CPU-level equivalence evidence and not hardware evidence; the gdb stub cannot observe I/O, so port equality rests on unicorn after the two engines were shown to agree instruction for instruction; the run stops at the bound because the PCI scan of the emulated chipset never matches 0x750126f, which is reported as a stop reason rather than as a completed boot."
  - "T26 acceptance (2026-11-19, branch A of the gap-closing ToT, owner request to close the unclosed gaps): a software CRC source and a scanout readback were added to the driver because AC-3 tiers 4 and 5 had no path at any privilege level (no /dev/fb*, no writeback connector, no get_crc_sources). src/sm750_drm.c grows 231 lines net: module param crc_window_bytes (default 262144, rounded to a multiple of 4, clamped to [4096, scanout_frame_size] and to vram_size minus scanout_offset), struct drm_vblank_work crc_work plus crc_enabled in sm750_drm_device, and sm750_crc_region / sm750_scanout_crc32 / sm750_crc_disable / sm750_crc_work_fn with verify_crc_source, get_crc_sources and set_crc_source under LINUX_VERSION_CODE >= KERNEL_VERSION(7,0,0), wired into sm750_crtc_funcs. The source name is scanout; the empty string and none disable, auto and scanout enable through drm_crtc_vblank_get plus drm_vblank_work_schedule(vblank_count+1) re-armed while enabled, and disable is cancel_sync plus vblank_put, so the cost while disabled is zero. No drm_crtc_crc_setup_work exists in the 6.17, 7.2 or 7.3 trees, so the driver owns the work item; the crc is crc32_le(~0U,...) ^ ~0U over the visible region read with memcpy_fromio in 256-byte chunks, and sdev->vram is now mapped with pci_iomap_wc in every probe path rather than only in the shadow path. A sm750_scanout seq_file prints offset, length, nonzero byte count, crc32 and a hex dump, and lives in sm750_regs_debugfs_add beside regs. Deviation from the brief, accepted: verify_crc_source is required by the framework even though the brief named only get and set. Compile matrix 7.2.15-100, 7.3.3-100, 7.3.4-100 and 6.17.1-300 all exit 0 with zero warnings (docs/evidence/scanout/01-build.txt). tests/check-scanout-crc.sh plus opt-in make crc-check added; check: recipe still exactly 17 commands. Runtime evidence was honestly SKIPped at delivery time: debugfs is root-only with no allowlisted path and there is no /dev/fb0 to draw into, so 02