assumptions:
  - "Primary RPM target Fedora 43 x86_64 (current host), spec written EL9-portable where macros allow: prefer portable macro equivalents over Fedora-only macros, and record any EL9 divergence as a comment in the spec rather than treating it as a blocker. dkms, rpmbuild 6.0.2, rpmdev-setuptree and spectool are present; ~/rpmbuild now EXISTS, so clean-buildroot work uses a fresh _topdir via --define."
  - "Kernel floor remains 6.17 per dkms.conf BUILD_EXCLUSIVE_KERNEL; the EL9 portability target does not lower it, so EL9 kernels below 6.17 are documented as unsupported in the spec comment rather than accommodated."
  - "No privileges are available: sudo -n permits only /usr/bin/dmidecode, /usr/local/cuda/bin/ncu and /usr/local/cuda/bin/nvprof; id reports groups=1006(coder) only; /dev/dri/card0 ACL grants user:duka:rw-; python3 open('/dev/dri/card0') raises PermissionError [Errno 13]; modetest -c prints 'no device found'; dmesg is denied; /sys/bus/pci/devices/0000:01:00.0/rom is unreadable; dkms install fails 'Error! You must be root to use this command.'; rpm -i --root= fails 'Unable to change root directory'."
  - "A second user decision on rootless-vs-wait is still pending; this plan is written so it is correct either way, because the privilege-upgrade path is additive and does not change task ownership or wave order."
  - "Repo is a fork (origin polaris.root.sx, upstream github.com/KodeMunkie/sm750hdmifb) at HEAD 27db03b on main, clean worktree; committed evidence files are acceptable deliverables."
  - "Scratch-path constraint (user, 2026-11-17): all intermediate and temporary files use /mega/tmp/, /mnt/INTEL_SSDSC2KB019T8_PHYF238503BW1P9DGN/tmp/ or /mnt/INTEL_SSDSC2KB038T8_PHYF320200Y73P8EGN/tmp/ (scratch root /mega/tmp/sm750/); nothing is written to the project worktree except committed deliverables and nothing to the user's home directory."

shared_context:
  baseline-env:
    - "Host: Fedora Linux 43 (Server Edition), kernel 7.3.3-100.fc43.x86_64, DMI product X10DRi, not containerized."
    - "Header trees present: /lib/modules/7.2.13-100.fc43.x86_64/build, 7.2.15-100.fc43.x86_64/build, 7.3.3-100.fc43.x86_64/build; no installed 6.17 tree (6.17.1-300.fc43 is obtained by rootless rpm2cpio extraction)."
    - "Tools present: rpmbuild 6.0.2, rpmdev-setuptree, spectool, dkms, modinfo, modetest, gcc 14.4.1 (/usr/bin), python3, make, dnf, rpm2cpio. Missing: igt-info, kmscube, v4l2-ctl, libdrm-devel (xf86drm.h) - all obtainable rootless via dnf download + rpm2cpio extraction."
    - "Privileges (verified by reviewer, authoritative): sudo -n -l lists only /usr/bin/dmidecode, /usr/local/cuda/bin/ncu, /usr/local/cuda/bin/nvprof; getent group video = video:x:39:cosmic-greeter,duka; /dev/dri/card0 ACL grants user:duka:rw-, not coder. No privileged operation may be assumed anywhere in this plan."
    - "Rootless libdrm procedure (reviewer-verified): mkdir -p /mega/tmp/sm750/libdrm && cd /mega/tmp/sm750/libdrm && dnf download libdrm libdrm-devel && for r in libdrm-*.rpm; do rpm2cpio \"$r\" | cpio -idmv; done && export PKG_CONFIG_PATH=/mega/tmp/sm750/libdrm/usr/lib64/pkgconfig PKG_CONFIG_SYSROOT_DIR=/mega/tmp/sm750/libdrm LD_LIBRARY_PATH=/mega/tmp/sm750/libdrm/usr/lib64 && make check -> exit 0, all 17 recipe commands green."
    - "Rootless 6.17 headers (reviewer-verified): dnf download kernel-devel-6.17.1-300.fc43; rpm2cpio <rpm> | cpio -idmv (about 4 min, retry once on 'Interrupted by header callback: Inconsistent server data'); make KDIR=/mega/tmp/sm750/k617/usr/src/kernels/6.17.1-300.fc43.x86_64 all -> exit 0; ./tests/build-all-kernels.sh <same dir> -> 'Built 3 combinations'."
    - "Hardware in place: 01:00.0 Silicon Motion SM750 [126f:0750] rev a1 bound to sm750hdmidrm; /sys/class/drm/card0-HDMI-A-1 status=connected, EDID world-readable, modes start 1920x1080; dkms status: sm750hdmifb/0.5.9, 7.3.3-100.fc43.x86_64, installed."
    - "Offline module build works rootless: make KDIR=/lib/modules/7.3.3-100.fc43.x86_64/build all exits 0 and produces src/sm750hdmidrm.ko; only diagnostics are kernel-header (linux/fs.h __counted_by) and gcc-version-mismatch warnings."
    - "Privilege-upgrade trigger (inert until sudo is granted): re-run the GAP-closing commands recorded in docs/evidence/EVIDENCE-GAPS.md and flip those rows to observed PASS; no task restructures."
  audit-context:
    - "Makefile anchors: Makefile:14 check target (17 recipe commands, measured), Makefile:34 check-all-kernels, Makefile:40 tests/check-vblank rule (uses pkg-config libdrm)."
    - "Build/package entry points: build-package.sh (deb + source tarball), dkms.conf (PACKAGE_NAME sm750hdmifb, PACKAGE_VERSION 0.5.9, BUILT_MODULE_NAME sm750hdmidrm, BUILD_EXCLUSIVE_KERNEL floor 6.17), .github/workflows/build.yml."
    - "Packaging assets: packaging/drm-postinst, drm-postrm, drm-prerm, sm750hdmidrm.conf, sm750hdmidrm.modules-load, 20-sm750hdmidrm.conf, write-xorg-config.sh, copyright."
    - "No .spec file exists anywhere in the tree at plan time."
  docs-context:
    - "Existing docs: HARDWARE, MODES, PARAMETERS, PROVENANCE, RELEASE-NOTES, STAGING-BENCHMARK, TESTING, VBLANK."
    - "make check covers metadata, mode, dither, softscale, cursor, DMA, damage, Xorg and packaging checks; make check-all-kernels covers three scanout defaults per header tree."
    - "Test entry points: tests/build-all-kernels.sh, tests/audit-release.sh, tests/check-drm-module.sh, tests/check-rpm-dkms.sh (to be added by T6)."

acceptance_criteria:
  - "AC-1 Device specifications located, read and archived: docs/specs/INDEX.md carries source URL, version, date and SHA-256 for the SM750 datasheet and product brief; docs/specs/REGISTER-MAP.md cross-references every MMIO register used by src/*.c; unresolved items are listed in docs/specs/GAPS.md; no vendor binaries enter the tree."
  - "AC-2 Repository audit and defect inventory: docs/AUDIT.md records every defect with severity and evidence, and docs/DEFECTS.md gives each one a status of fixed, accepted or deferred with justification."
  - "AC-3 Runtime and hardware validation ladder: connector state -> modetest enumeration -> modeset -> framebuffer readback -> scanout CRC -> external capture, each tier backed by an evidence path; tiers that could not be reached are GAP rows with closing commands."
  - "AC-4 Test strategy and results: docs/TEST-STRATEGY.md names the in-repo and external suites, and every PASS row is backed by an evidence file that exists in the tree."
  - "AC-5 Build integrity: make check green (17 recipe commands), build matrix covering the declared 6.17 floor plus the installed 7.2/7.3 header trees, and no compiler warnings originating in src/."
  - "AC-6 Packaging: an rpmbuild spec produces a noarch DKMS source carrier with correct scriptlets and dependencies, verified rootless (rpmbuild -ba, rpm -qp --scripts, rpm -qlp, rpm -qpR, dkms sandbox status built); root-only install and erase are documented gaps with exact closing commands."
  - "AC-7 Deliverable index and clean-checkout reproduction: docs/DELIVERABLES.md maps AC-1..AC-7 to repo paths and verification commands, README documents the RPM/DKMS path, and every root-only step is labelled with its closing command."

tasks:
  - id: T1
    title: Archive SM750 device specifications with checksums and authority index
    description: |
      Rung: new artifact (no in-repo spec archive exists). Locate and cite the
      authoritative SM750 documents, record URL/version/date/SHA-256, and cross-reference
      register and mode definitions against the driver. Third-party binaries stay out of
      the tree; only the index, checksums and authored cross-reference tables are
      committed. Enforce the degradable-gate fallback ladder; record every gap instead of
      blocking.
    wave: 1
    depends_on: []
    agent: gem-researcher
    exploration_mode: question
    context_cluster: audit-context
    status: completed
    retries_used: 0
    acceptance_criteria:
      - "docs/specs/INDEX.md records for the SM750 datasheet and the SM750 product brief: source URL, document version and date, retrieval date, and SHA-256 of the downloaded file; each checksum is reproducible by the documented re-download-and-hash command."
      - "No third-party binary document is committed: `git ls-files docs/specs` lists only text artifacts (INDEX.md, SHA256SUMS, GAPS.md and authored cross-reference files), keeping docs/PROVENANCE.md:47 true and keeping vendor PDFs out of the build-package.sh source tarball."
      - "docs/specs/INDEX.md classifies each source as authoritative vs vendor-supplied vs substitute and states which fallback rung was used per document."
      - "Coverage table maps display controller, mode/clock tables, DMA engine, GPIO/I2C (SiI9024 control bus) and cursor registers to a cited document section or to a named substitute source."
      - "Cross-check of src/ddk750_reg.h against the cited sources lists every register used by the driver without a citation, each with file:line."
      - "If a document is unobtainable, docs/specs/GAPS.md records the exact URL/attempt, the substitute used, and states that the stage is not blocked."
    handoff:
      constraints:
        - "Known existing source URLs in docs/HARDWARE.md:59 (SM750 product brief, siliconmotion.com) and docs/HARDWARE.md:60 (SM750 datasheet v1.4, VersaLogic)."
        - "Download to /mega/tmp/sm750 for hashing; never commit the PDFs."
        - "No writes outside docs/specs/."
        - "Treat documented boundary/count/completion semantics as hypotheses; docs/HARDWARE.md:23 records a case where the spec is wrong."
      relevant_context:
        - "docs/PROVENANCE.md asserts DDK files originate from Linux staging sm750fb; that tree is the first substitute for register semantics."
        - "Driver source: src/ddk750_reg.h, src/ddk750_mode.c, src/ddk750_display.c, src/ddk750_hwi2c.c, src/ddk750_swi2c.c, src/sii902x.c."
        - "Reviewer-verified: tests/audit-release.sh:54 greps for 'all rights reserved|confidential' and does not trip on these PDFs, so provenance consistency is the only concern."
      high_risk_signals:
        - "Spec/behavior divergence already proven (docs/HARDWARE.md:23); do not let spec text override validated workarounds."
      critic_signals: []

  - id: T2
    title: Audit repo state and produce severity-ranked defect inventory
    description: |
      Rung: reuse existing sources; no code changes. Establish executable ground truth
      for layout, build system, declared kernel range, packaging state and current test
      status under rootless conditions, then enumerate defects with reproduction commands.
      This inventory is the input to the fix task and the acceptance review.
    wave: 1
    depends_on: []
    agent: gem-researcher
    exploration_mode: audit
    context_cluster: audit-context
    status: completed
    retries_used: 0
    acceptance_criteria:
      - "docs/AUDIT.md records HEAD sha, branch, remotes, worktree cleanliness, source file count/LOC, module identity (sm750hdmidrm) vs package identity (sm750hdmifb 0.5.9), and every build/package entry point (Makefile targets, build-package.sh, dkms.conf, .github/workflows/build.yml) with file:line references."
      - "Declared kernel support range is stated with evidence from dkms.conf BUILD_EXCLUSIVE_KERNEL, README.md kernel-compatibility section and tests/build-all-kernels.sh version case, and contrasted with the handoff claim of 5.14."
      - "docs/AUDIT.md defect table has IDs, severity S1-S4, symptom, reproduction command and observed evidence; it includes at minimum: no rpmbuild spec anywhere, make check requiring libdrm which is absent from the host, no archived specifications, absent igt/kmscube, gcc 14.4.1 vs kernel gcc 15.3.1 mismatch, no installed 6.17 header tree, and no register-dump facility in the driver."
      - "Packaging audit states precisely what exists (build-package.sh .deb plus source tarball, packaging/ maintainer scripts including the Debian-only packaging/drm-postinst:66-73 update-initramfs call, modprobe/modules-load/xorg conf) and what is missing for RPM/DKMS install verification."
      - "Privilege matrix is recorded with the exact verified denials (sudo -n -l entries, groups, /dev/dri/card0 ACL, dmesg, PCI ROM, dkms install, rpm --root) and names which acceptance evidence each denial blocks."
      - "Contradicted-claim list names each README/acceptance premise not supported by repo state (fbdev userspace contract, 5.14 kernel floor, assumed root access) with file:line."
    handoff:
      constraints:
        - "Read-only: no writes outside docs/."
        - "Do not attempt privileged operations; cite the verified denial instead."
        - "Build in a copy such as /tmp/sm750build, never in the worktree, to keep it clean."
      relevant_context:
        - "Verified at plan time: make KDIR=/lib/modules/7.3.3-100.fc43.x86_64/build all exits 0; plain make check exits 2 at tests/check-vblank because libdrm-devel is absent."
        - "Test entry points: Makefile:14 check (17 recipe commands), Makefile:34 check-all-kernels, Makefile:40 tests/check-vblank rule, tests/build-all-kernels.sh, tests/audit-release.sh."
        - "Register-dump absence: driver exposes only drm_vram_mm_debugfs_init at src/sm750_drm.c:3256 and has no register-dump module_param; /dev/mem is closed by CONFIG_STRICT_DEVMEM=y and CONFIG_IO_STRICT_DEVMEM=y."
      high_risk_signals: []
      critic_signals: []

  - id: T3
    title: Provision rootless test toolchain and capture readable hardware baseline
    description: |
      Rung: reuse existing host tooling; new scripts only for capture. Establish the
      rootless toolchain (libdrm via dnf download + rpm2cpio, IGT and kmscube availability
      assessment), capture every baseline artifact that is readable without privileges, and
      record each unreadable artifact as an explicit GAP with its exact closing command.
    wave: 2
    depends_on: [T2]
    agent: gem-devops
    context_cluster: baseline-env
    status: completed
    retries_used: 0
    acceptance_criteria:
      - "docs/ENVIRONMENT.md lists host kernel, distro, header trees, a tool matrix (rpmbuild, dkms, modinfo, modetest, gcc, python3, igt-info, kmscube, v4l2-ctl, libdrm) with version or MISSING plus how each missing item is obtained rootless, and a privilege matrix with the exact verified denials."
      - "The rootless libdrm procedure is recorded verbatim with the env-var chain (dnf download libdrm libdrm-devel, rpm2cpio | cpio -idmv, PKG_CONFIG_PATH, PKG_CONFIG_SYSROOT_DIR, LD_LIBRARY_PATH) together with the observed `pkg-config --modversion libdrm` output and confirmation that tests/check-vblank compiles."
      - "docs/evidence/baseline/ contains committed captures, each with exact command line and timestamp: lspci -vvv -d 126f:0750, EDID blob as hex dump plus crc32 from /sys/class/drm/card0-HDMI-A-1/edid, connector status/modes/enabled, dkms status, modinfo sm750hdmidrm, lsmod state."
      - "docs/evidence/EVIDENCE-GAPS.md names each blocked artifact with its exact closing command and the observed denial: VBIOS ROM (dd from /sys/bus/pci/devices/0000:01:00.0/rom, currently unreadable), dmesg excerpt (dmesg currently denied; test and record whether journalctl -k -b is an available substitute), /dev/dri modeset capture (modetest -c currently 'no device found'), and register dumps."
      - "Register-dump entry is an explicit GAP citing option (a): the closing command is a debugfs MMIO dump whose facility T5 adds in src/, then a root-only read of that debugfs file before and after a single modeset. modetest is not cited as a register-dump source anywhere."
      - "IGT and kmscube availability is stated factually (packages obtainable via dnf download, but execution requires /dev/dri access that is denied), and no run is claimed."
      - "No changes to src/ or tests/ in this task."
    handoff:
      constraints:
        - "Never claim an observed result that was not produced on this host; a denial is recorded as a gap, not a failure and not a pass."
        - "Capture files are text or small binaries only; keep the corpus reproducible from the recorded commands."
        - "Use /mega/tmp/sm750 for scratch space and for extracted RPM trees."
      relevant_context:
        - "modetest -c prints 'no device found' because /dev/dri/card0 is root:video 0660 with ACL user:duka:rw- and coder lacks both."
        - "/sys/bus/pci/devices/0000:01:00.0/rom exists but is root-only (0600); VBIOS layout is 64 KiB."
        - "Card is bound to sm750hdmidrm and connector card0-HDMI-A-1 is connected with a world-readable EDID, so the read-only capture path works without privileges."
        - "Privilege-upgrade trigger: if sudo is later granted, re-run the recorded closing commands and flip the gap rows to observed PASS."
      high_risk_signals:
        - "Shared GPU global register state: register dumps must be taken with a documented capture point (before/after a single modeset) so they are comparable."
      critic_signals: [cross_domain_impact]

  - id: T5
    title: Fix inventoried defects, add register-dump facility, prove warning-clean build matrix
    description: |
      Rung: reuse existing code and checks; surgical fixes only, no architectural rewrite.
      Address S1/S2 defects from docs/AUDIT.md with before/after evidence, add the debugfs
      MMIO register-dump facility that closes the T3 register gap, and prove the driver
      builds warning-clean in driver sources across all four header trees (6.17.1-300
      extracted rootless, 7.2.13-100, 7.2.15-100, 7.3.3-100) and all three scanout
      defaults.
    wave: 3
    depends_on: [T2, T3]
    agent: gem-implementer
    status: completed
    retries_used: 1
    acceptance_criteria:
      - "docs/DEFECTS.md carries one row per inventoried defect with status fixed/deferred/accepted, the change reference, and a before/after evidence path under docs/evidence/builds/ for every fixed item."
      - "A debugfs (or module_param) register-dump facility exists in src/, is documented in docs/ and in docs/evidence/EVIDENCE-GAPS.md as the closing mechanism for the T3 register gap, and is exercised as far as privileges allow; if the read requires root, the exact command is recorded and the row stays a documented gap."
      - "`make check` passes with all 17 recipe commands executing under the recorded rootless libdrm env chain (PKG_CONFIG_PATH, PKG_CONFIG_SYSROOT_DIR, LD_LIBRARY_PATH); the command and exit status are archived."
      - "`JOBS=12 ./tests/build-all-kernels.sh` completes for all installed trees and all three scanout defaults ('Built 9 sm750hdmidrm kernel/format combinations'); the extracted 6.17.1-300.fc43 tree additionally builds ('Built 3 combinations'); all logs archived."
      - "No compiler warning or error originates in src/*.c or src/*.h in any archived build log; kernel-header diagnostics and gcc-version-mismatch notes are documented as out-of-scope in docs/DEFECTS.md."
      - "Deferred defects each carry a justification naming why the fix is out of scope (for example requiring an atomic rewrite or a privilege this host does not have)."
    handoff:
      constraints:
        - "No atomic DRM/KMS rewrite; no new userspace contract."
        - "Preserve empirically validated workarounds even where the datasheet disagrees (docs/HARDWARE.md:23)."
        - "Do not weaken existing checks to make the suite pass; changing a check requires a documented reason."
        - "Keep the module name sm750hdmidrm and package sm750hdmifb unchanged."
        - "Do not add privileged operations; the register-dump facility must be inert until a root user reads it."
      relevant_context:
        - "Known S1: no rpmbuild spec (owned by T6, do not duplicate). Known S2: tests/check-vblank needs libdrm headers, supplied rootless by T3."
        - "Register-dump anchors: src/sm750_drm.c:3256 currently sets only .debugfs_init = drm_vram_mm_debugfs_init; /dev/mem is unavailable (CONFIG_STRICT_DEVMEM=y, CONFIG_IO_STRICT_DEVMEM=y)."
        - "6.17 rootless build: dnf download kernel-devel-6.17.1-300.fc43 then rpm2cpio extract; retry once on 'Interrupted by header callback: Inconsistent server data'."
        - "Build is clean in driver sources today apart from kernel-header __counted_by warnings."
      high_risk_signals:
        - "Shared GPU global register state: fixes touching DDK register sequences must keep the documented capture points comparable."
      critic_signals: [architecture]

  - id: T4
    title: Select test strategy and record post-fix runs with pass/fail criteria
    description: |
      Rung: reuse existing suite first, add external suites only where they prove a claim
      the in-repo suite cannot. Define an explicit testable production bar per acceptance
      criterion, then record post-fix runs in the same worktree (T5 has completed) plus the
      blocked hardware runs as gaps.
    wave: 4
    depends_on: [T3, T5]
    agent: gem-documentation-writer
    context_cluster: docs-context
    status: completed
    retries_used: 0
    acceptance_criteria:
      - "docs/TEST-STRATEGY.md chooses suites from in-repo checks, libdrm modetest, kmscube and an IGT GPU Tools subset, and excludes v4l2-utils with a stated reason (no capture path on this board); each entry gives exact package name and version or availability status, runnable command, pass/fail criterion and evidence path."
      - "A results table records every executed run with kernel version, tool version, command, evidence path and verdict PASS/FAIL/GAP; no row is marked PASS without an evidence path that exists in the repo, and every row is a post-T5 run."
      - "The document defines, per acceptance criterion 3 and 5, what evidence would prove the claim (for example framebuffer content readback versus connector status alone) and lists which claims remain unproven."
      - "IGT conformance is labelled a stretch artifact, not a gating deliverable, and its current blocker (no /dev/dri access) is stated with the closing command."
      - "The full 18-check make check suite result is recorded with its rootless env chain; excluding a check requires an explicit documented reason."
      - "All statements are consistent with docs/ENVIRONMENT.md and docs/evidence/; conflicting claims are resolved in favour of recorded evidence."
    handoff:
      constraints:
        - "No invented versions: tools that are absent are listed as unavailable with how they are obtained."
        - "Do not upgrade a GAP to PASS by inference."
        - "Writes limited to docs/TEST-STRATEGY.md."
        - "Record only runs executed after T5 completed; do not cite pre-fix results as current."
      relevant_context:
        - "T5 archives make check (17 recipe commands) and build-matrix logs; cite those paths rather than re-running make in parallel with another task."
        - "Header trees: 6.17.1-300 (extracted rootless), 7.2.13-100, 7.2.15-100, 7.3.3-100."
        - "IGT and kmscube packages are obtainable rootless via dnf download but cannot execute without /dev/dri access."
      high_risk_signals: []
      critic_signals: [contract_change]

  - id: T6
    title: Add rpmbuild spec that installs and registers the driver through DKMS
    description: |
      Rung: new artifact (no .spec exists; today packaging is .deb-only). Build a noarch
      DKMS RPM mirroring build-package.sh content, Fedora 43 primary and EL9-portable where
      macros allow, then verify everything that is verifiable rootless and record the
      root-only install/erase steps as a gap with exact closing commands.
    wave: 4
    depends_on: [T5]
    agent: gem-devops
    context_cluster: baseline-env
    status: completed
    retries_used: 0
    acceptance_criteria:
      - "packaging/sm750hdmifb.spec exists with Version 0.5.9 and BuildArch noarch, and `rpmbuild -ba --define '_topdir /mega/tmp/sm750/rpmbuild-v3' packaging/sm750hdmifb.spec` exits 0 from a fresh _topdir (~/rpmbuild already exists, so a new subdir or explicit _topdir is mandatory), producing SRPM and RPM with the log archived under docs/evidence/packaging/."
      - "Spec declares dependencies explicitly: BuildRequires rpm-build, dkms, make, gcc; Requires dkms; Requires(post) dkms, kmod; Requires(preun) dkms. `rpm -qpR` and `rpm -qp --buildrequires` output is archived."
      - "Scriptlet placement is stated and implemented: %post runs dkms add; %posttrans runs dkms build plus dkms install so headers are available by then; %preun runs dkms remove; %postun is not used. --rpm_safe_upgrade semantics are chosen and implemented (scriptlet guard on $1 == 1) and documented in the spec."
      - "Missing-headers behaviour is defined and implemented: when no supported kernel with headers is present, %posttrans prints a warning to stderr and exits 0 so the transaction does not fail; this is asserted by a shell-level test or documented dry run."
      - "packaging/drm-postinst:66-73 is NOT ported verbatim: the spec must not call update-initramfs and must not exit 1 on missing headers; the Fedora path uses dkms install plus depmod -a with a warning. The spec contains a comment recording this divergence."
      - "%files is enumerated exactly, with an explicit ship/no-ship decision for each build-package.sh asset: /usr/src/sm750hdmifb-0.5.9/{Makefile,dkms.conf,src/Makefile,src/Kconfig,src/*.c,src/*.h}, /etc/modprobe.d/sm750hdmidrm.conf, /etc/modules-load.d/sm750hdmidrm.conf, /usr/share/X11/xorg.conf.d/20-sm750hdmidrm.conf, /usr/lib/sm750hdmifb/write-xorg-config (0755), and %doc README.md LICENSE docs/RELEASE-NOTES.md docs/TESTING.md plus packaging/copyright. `rpm -qlp` output is archived and matches the decision list."
      - "Rootless verification is recorded as observed evidence: rpmbuild -ba, rpm -qp --scripts, rpm -qlp, rpm -qpR, and dkms add plus dkms build inside a sandbox (`dkms --dkmstree/--sourcetree/--installtree` under /mega/tmp/sm750) reporting status 'built'."
      - "Root-only steps are recorded as an explicit gap in docs/evidence/EVIDENCE-GAPS.md with exact closing commands: dnf install of the built RPM, dkms status reporting 'installed', modinfo from the installed path, dnf remove, and post-erase status showing registration removed. tests/check-rpm-dkms.sh implements all assertions and exits non-zero on failure; it is expected to reach the 'built' assertions rootless and to skip the root-only ones with a clear message."
      - "docs/PACKAGING-RPM.md documents clean-checkout reproduction including rpmdev-setuptree or explicit _topdir, spec dependencies, EL9 caveats, the missing-headers warning behaviour and rollback."
    handoff:
      constraints:
        - "Do not regress the existing .deb path (build-package.sh, tests/check-drm-packaging.sh)."
        - "Keep DKMS package name sm750hdmifb and module name sm750hdmidrm; preserve BUILD_EXCLUSIVE_KERNEL semantics (floor 6.17)."
        - "No source changes outside packaging/, tests/check-rpm-dkms.sh and docs/."
        - "Assume no privileges: never write scriptlets that require root at RPM build time."
      relevant_context:
        - "Content list to mirror is in build-package.sh:30-50 (Makefile, README.md, LICENSE, dkms.conf, src files, modprobe.d, modules-load.d, xorg.conf.d, write-xorg-config, copyright, docs/RELEASE-NOTES.md, docs/TESTING.md)."
