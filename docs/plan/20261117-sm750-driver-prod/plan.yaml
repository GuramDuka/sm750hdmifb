  - "Device-access correction (2026-11-18): the SM750 registers no render node (no /dev/dri/by-path/pci-0000:01:00.0-render; renderD128 belongs to 0000:02:00.0). Only the card node is relevant, addressed by the stable by-path link pci-0000:01:00.0-card; the debugfs index equals the cardN suffix and must be resolved via readlink rather than hardcoded. A udev ACL rule replaces the manual setfacl step - artifacts staged at /mega/tmp/sm750/."
  - "Device access decision (2026-11-18, user choice): the udev rule 99-sm750-coder-acl.rules grants u:coder rw on the SM750 card node at every probe, so no setfacl sudo line is enabled; the sudoers line stays commented as a one-shot fallback."
  - "T6 correction (2026-11-18): kernel headers are NOT missing. /usr/src/kernels/ holds 7.2.15-100, 7.3.3-100 and 7.3.4-100, /lib/modules/7.3.4-100.fc43.x86_64/build -> /usr/src/kernels/7.3.4-100.fc43.x86_64, Module.symvers present. The dkms sandbox failure was a lookup-path artifact: with a custom --installtree dkms resolves headers at <installtree>/<kver>/build|source. Fix by symlinking build inside the sandbox installtree (fallback: --kernelsourcedir). No dnf download of kernel-devel is required. Only 6.17 is absent from /usr/src/kernels and stays covered by the koji tree at /mega/tmp/sm750/t5/k617."
  - "sudoers syntax rule (2026-11-18): sudoers treats ':' ',' '=' and '\\' as special inside command arguments and requires a backslash before each one. Escaping alone proved fragile, so the policy is now to keep ZERO colons in command lines: anything needing a PCI address or vendor:device pair goes through a fixed helper in /usr/local/sbin (sm750-regs, sm750-lspci, sm750-vbios-dump). Staged file sha256 9b0249ce6572da5a57f73e4e2991ddf86a197ec4c88c0a79367c9ff2cb2db14a passes visudo -c -f standalone and appended to a copy of /etc/sudoers (both exit 0). The dnf install line names the exact RPM instead of a glob."
  - "Sudo recovery note (2026-11-18): an earlier broken copy was installed at /etc/sudoers.d/10-sm750-debug, which makes every sudo invocation fail with a syntax error at lines 32:63 and 33:60 (the unescaped 01:00.0 and 126f:0750 in the lspci lines). Repair needs a non-sudo root path: pkexec (polkit admin) or su -, since sudo itself is unusable until the file is replaced. Documented closing commands: pkexec install -m 0440 -o root -g root /mega/tmp/sm750/10-sm750-debug.sudoers /etc/sudoers.d/10-sm750-debug then visudo -c."
  - "Access state 2026-11-18: with the sudo grants active, sudo -n dmesg returns 154236 bytes (150 sm750-matching lines) and sudo -n journalctl -k -b -q --no-pager returns 1903 lines, so GAP-B2 is observable now. sm750-lspci, modetest -c and the card0 ACL all work. Two root steps remain outstanding: /usr/local/sbin/sm750-vbios-dump is installed 0644 so sudo reports it as not found, and the installed allowlist still carries 0.5.9 in the four dkms lines plus the dnf install path while the regenerated file carries 0.6.0."
  - "Sysfs page cap (2026-11-18): the VBIOS helper v1 used `dd bs=65536 count=1` and produced a 4096-byte file. A sysfs binary attribute returns at most one page per read(2), so dd takes the short read as EOF. Proven on an unrelated attribute: /sys/kernel/btf/nf_conntrack is 26549 bytes, `dd bs=65536 count=1` gives 4096 bytes, `dd bs=4096` gives all 26549. Helper v2 uses `dd bs=4096` with no count and exits 2 with a warning when the size is not 65536; staged at /mega/tmp/sm750/sm750-vbios-dump, sha256 9e6c5db7853e3a58160d83c63aaee01144b20061a98a57c241188b3b6dd62a8f, ASCII only, sh -n clean."
  - "Host-owner root actions executed 2026-11-18 (verified): /usr/local/sbin/sm750-vbios-dump installed 0755 root:root (sha256 e2f6f68791ebd3f341ca77cb84169bda8843c1ce192f2e500b51faa01e67f585, i.e. the v1 body) and /etc/sudoers.d/10-sm750-debug replaced with the 0.6.0 file. Verified by `sudo -n -l` (19 NOPASSWD entries, every dkms line and the dnf install path at 0.6.0, zero colons in command lines) and by one successful end-to-end run of the helper. Remaining root action: reinstall the helper with the v2 body (the grant covers the path, not the content, so no sudoers edit is needed)."
  - "T10 completed 2026-11-18 on the stale 0.5.9 module and is the BEFORE half of the pair. Evidence: docs/evidence/runtime/01-original-state.txt .. 07-kernel-log.txt. The CRTC already had an active 1920x1080 mode (connector 35, crtc 38, fb 43), so every experiment captured state first and restored it by trap; the final state is byte-identical. modetest -s really programs 1024x768 (dmesg staging 1572864 = 1024*768*2, reverting to 4147200 at +2.576 s) but the mode is dropped when the process exits; `modetest -a` is a silent no-op on this driver. kmscube renders 299 frames in 5.066709 s = 59.01 fps at 60 Hz on llvmpipe (software, not SM750 acceleration); the earlier 'user interrupted!' was stdin EOF, fixed with `tail -f /dev/null |`. Pixel-level readback stays impossible unprivileged: CONFIG_FB_DEVICE is not set (no /dev/fb*), no writeback connector, modetest -o needs atomic+writeback, and a non-owning client cannot MAP_DUMB another client's fb - the GEM object behind fb 43 reads back 48 nonzero bytes of 8294400 because of the shadow/backbuffer path."
  - "T10 found a genuine driver defect in IGT: kms_addfb_basic subtest size-max fails with DRM_IOCTL_MODE_ADDFB2 errno 22 EINVAL at ../tests/kms_addfb_basic.c:594. This is driver behaviour, not tooling, and is not in docs/AUDIT.md. Five further IGT failures are tooling: kms_getfb getfb-handle-protection and getfb2-handle-protection need root (igt_drop_root, ../lib/igt_aux.c:1123), and kms_setmode/kms_atomic/kms_rmfb/kms_flip/kms_pipe_crc_basic abort at kmstest_set_vt_graphics_mode (../lib/igt_kms.c:1558, errno 13) because /dev/tty0 is crw------- root tty. kms_fb_coherency and kms_dirtyfb exit 77 because IGT cannot classify sm750hdmidrm (../lib/drmtest.c:754, IGT_FORCE_DRIVER does not help). core_getversion and dumb_buffer pass."
  - "T10 captured a seven-line kernel error episode at dmesg [8523..8586]: 'sm750hdmidrm 0000:01:00.0: [drm] *ERROR* failed to enable HDMI mode: -110' plus a drm_atomic_helper_commit_hw_done WARNING (src/sm750_drm.c:3116 in the fail label of sm750_pipe_enable), three 10 s commit-wait timeouts (CRTC:38, CONNECTOR:35, PLANE:36) and 'refcount_t: underflow; use-after-free' at refcount_warn_saturate via __drm_atomic_helper_plane_destroy_state -> drm_gem_simple_kms_destroy_shadow_plane_state -> drm_release, all on the fbdev-restore path at client close. It did NOT reproduce in ~25 controlled attempts, so it is recorded as an observed 0.5.9 defect with an unisolated trigger."
  - "docs/evidence/EVIDENCE-GAPS.md:87-89 is CONTRADICTED: it claims journalctl -k -b yields 0 lines and '-- No entries --', but T10 measured 2017 lines from both `sudo -n dmesg` and `sudo -n journalctl -k -b -q --no-pager`. The file was not edited by T10; the contradiction is recorded in docs/evidence/runtime/07-kernel-log.txt and in the TEST-STRATEGY conflict table. GAP-B2 must be closed on the corrected measurement."
  - "Context clusters are grouped by primary agent because a shared_context key requires one agent: baseline-env = T3/T6 (gem-devops), audit-context = T1/T2 (gem-researcher), docs-context = T4/T7 (gem-documentation-writer). T5 (gem-implementer) and T8 (gem-reviewer) are intentionally standalone: no peer task shares their agent, and they consume cluster findings through relevant_context references."

  - "T12 acceptance (2026-11-18): the VBIOS image is 49152 bytes (48 KiB), NOT 65536. Header size byte 0x02=0x60 and PCIR image-length field at 0x2c=0x0060 both declare 96 blocks; the file length equals the declared length and the whole-image byte sum is 0 mod 256. The helper's EXPECT=65536 is a stale constant, so its exit 2 is SUCCESS on a correct capture. Image /mega/tmp/sm750/vbios-01-00-0.bin sha256 16796a7b8319c4a798a2225221b4c0ed9b5f52e2c4f1c3841aa4a6f8ba217551, reproduced byte-identically on a second read. PCIR checksum span, VBE mode list and VBE total memory stay UNDETERMINED rather than guessed."
  - "T13 acceptance (2026-11-18): the cursor plane keeps DRM_FORMAT_ARGB8888 and declares its blend mode via drm_plane_create_blend_mode_property(&sdev->cursor_plane, BIT(DRM_MODE_BLEND_PREMULTI)) at src/sm750_drm.c:3491. Rationale: the hardware really consumes per-pixel alpha (dithered palette mask) and the driver unpremultiplies at src/sm750_drm.c:2618, so XRGB8888 would misdescribe it; validate_blend_mode_for_alpha_formats() in drivers/gpu/drm/drm_mode_config.c:867-885 only needs blend_mode_property to be non-NULL. drm_plane_create_alpha_property() stays absent because there is no plane-wide alpha factor. The live warning clears only after T11 reloads the module."
  - "io_uring assessment (2026-11-18, user question): NOT applicable and not to be implemented. Evidence: no DRM driver in the 7.3.4 tree implements uring_cmd (grep count 0 under drivers/gpu/drm/), DEFINE_DRM_GEM_FOPS at src/sm750_drm.c:3255 expands to DRM_GEM_FOPS with no .read/.write, driver_features at :3367/:3381 is DRIVER_GEM|DRIVER_MODESET|DRIVER_ATOMIC with no DRIVER_RENDER and no PRIME/dma-buf path, and the data movement is memcpy_toio into the VRAM BAR (:1529, :1550, :1608, :2848) plus an 8-row DMA1 burst. The cost is memory bandwidth and the vblank budget, not syscall overhead; a new URING_CMD UAPI would be a contract change outside this plan."
  - "VBIOS execution harness (2026-11-18): QEMU 10.1.5 cannot load this image through -option-rom or -device VGA,romfile= because load_option_rom requires 0x55AA at the END of a 512-byte block and this image has zero such blocks. The generic loader route works and is the T17 harness: -device loader,file=...,addr=0xc0000,force-raw=on plus -S -gdb tcp::PORT, then gdb sets CS=0xc000, EIP=0x1256 and single-steps (proven: 246 ROM instructions traced from 0x000c1256, nested call to 0xc6065 executed). unicorn 2.1.4 in /mega/tmp/sm750/pylib is the second engine for trace comparison."
  - "Release-archive defect found at T13 (2026-11-18, pre-existing): ./tests/audit-release.sh exits 1 with 'Source archive contains development-only content: docs/plan' because build-package.sh:98 builds the tarball from git ls-files and docs/plan/ is now tracked, while tests/audit-release.sh:54-58 forbids docs/plan, docs/evidence and docs/images. Not caused by T13 or T12; needs its own fix (exclude list entry or an audit rule change) before AC-6 can pass."
  - "T15 acceptance (2026-11-18): the kms_addfb_basic size-max EINVAL is CORRECT BY DESIGN, not a driver defect. IGT size_tests() at ../tests/kms_addfb_basic.c:590-594 puts a second framebuffer DRM_FORMAT_RGB565 1024x2048 pitch 2048 on the same 4 MiB object; it is rejected twice over by generic DRM code, both drm_dbg_kms-only and therefore silent without drm.debug: the height check in drm_internal_framebuffer_create() (bad framebuffer height 2048 > max_height 1152, declared at src/sm750_drm.c:3437 from SM750_DRM_MAX_HEIGHT at :95) and the atomic plane-format gate in drm_gem_fb_init_with_funcs() (the primary plane advertises XRGB8888 only). Every datasheet limit is satisfied (pitch 16368 B, window height 4095 lines, plane BR 11-bit = 2048 lines, 64 MiB VRAM), so silicon is not the constraint; the limits are deliberate interface declarations. Decided: no code change; document the declared limits and stop counting size-max as a driver FAIL. Live values came from the stale 0.5.9 module and need a re-check on 0.6.0 after T11."
  - "Static-analysis toolchain adopted (2026-11-18, user acted on m00767): the host owner installed sparse 0.6.4, dwarves 1.32 (pahole), smatch 1.73, cppcheck 2.19.1, coccinelle 1.3, kmscube, bear 3.1.6, kernel-tools 7.3.4-100, v4l-utils 1.32.0 (edid-decode) and igt-gpu-tools 2.4; the orchestrator verified every binary on PATH. T19 was created to convert that into a repeatable opt-in gate, deliberately NOT part of the check target because tests/check-drm-module.sh and docs/AUDIT.md A23 both assert exactly 17 recipe commands."

  - "Session ownership correction (2026-11-18, user report m00899): Plasma does NOT drive the SM750. kwin_wayland (pid 2252, uid 1000) drives card1 = 0000:02:00.0 GTX 1070, whose DVI-D-1 is connected and enabled; card0 = 0000:01:00.0 SM750 has no userspace master. The enabled CRTC 38 at 1920x1080 on card0 is set by the driver's OWN in-kernel fbdev client: drm_client_setup(&sdev->drm, drm_format_info(DRM_FORMAT_XRGB8888)) at src/sm750_drm.c:3784, proven by dmesg at probe - 'full-frame backbuffer staging enabled (4147200 bytes per buffer)' at [6.265979] = 1920x1080x2 and 'fb0: sm750hdmidrmdrm frame buffer device' at [6.341676], both before any userspace client attached. Corollaries: (a) T10's and T15's phrase 'Plasma session on connector 35' is wrong and must not be repeated; (b) the IGT VT subset is blocked only by /dev/tty0 being crw------- root tty, not by master ownership; (c) T10's modetest modeset succeeding proves no other master existed on card0 at that moment, because drmSetMaster would have failed; (d) the SM750 HDMI output currently shows the kernel console, so our modesets cannot blank the user's desktop, but the state is still captured and restored; (e) a working console at probe is positive AC-3 evidence for the driver."
  - "T16 acceptance (2026-11-18): the HDMI -110 episode is REPRODUCED once in 205 controlled attempts and its cascade cause is identified with high confidence. sm750_pipe_enable's fail: label (src/sm750_drm.c:3105-3117) returns the -110 from sm750_program_mode without calling drm_crtc_vblank_on() and without arming the commit's vblank event, which the success path does at src/sm750_drm.c:3101-3102; drm_atomic_helper_commit_hw_done therefore trips WARN_ON(new_crtc_state->event) (drivers/gpu/drm/drm_atomic_helper.c:2758 in 7.3.4), the commit never completes, the three atomic objects each report 'commit wait timed out' after 10 s, and a later drm_release restore can underflow a refcount through drm_gem_simple_kms_destroy_shadow_plane_state. Trigger shape: SIGINT a kmscube ~300 ms into its first commit, then modetest -s 35@38:1024x768-60; measured 1/36 (2.8 percent) for that shape, 0/169 for every other shape. The 330.003 ms gap admits exactly one 100 ms wait_display_value() timeout after ~155 ms of fixed sii902x quiesce (src/sii902x.c:748 msleep(150)), ranking ddk750_set_display_control(0, false) at src/sm750_drm.c:1316 first and ddk750_set_logical_disp_out at :1346 second; two 100 ms waits would need 355 ms and do not fit. Which of the five fallible calls (src/sm750_drm.c:1312, :1316, :1319, :1346, :1349) returns -110 stays undetermined on 0.5.9 and is recorded as GAP-B8 with a closing command. Recorded as A27 (S3, open); a production-clean claim is blocked until the fail path is fixed or the risk is accepted with the measured rate."


  - "T11 acceptance (2026-11-18): 0.6.0 is installed and loaded on all three kernels and the AFTER-half runtime evidence is captured. Precondition failure worth keeping: the staged RPM (sha256 b54480b0f972161554107bdc4ec898b42f6252a4490cfe8493420e302913f6bc) had zero blend-mode references, so it predated T13 and was rebuilt rootless (rpmbuild -ba, 80 tracked files) to /mega/tmp/sm750/t6/rpmbuild/RPMS/noarch/sm750hdmifb-0.6.0-1.fc43.noarch.rpm, 90281 B, sha256 265449aa59446feb580d3d0d68a7a7597e08c30c73331455d7a5cd4a864563c5, payload src/sm750_drm.c byte-identical to the tree. Install through the allowlisted dnf path built+installed for 7.2.15-100, 7.3.3-100 and 7.3.4-100 (6.18.13-200 skipped: headers absent - but see the correction decision: that is not an installed kernel). Reload needed one retry because T16's matrix sweep still held card0 ('Module sm750hdmidrm is in use'). Verified after reload: modinfo 0.6.0, modetest '(version 0.6.0 at 0)', IGT core_getversion 'v0.6', srcversion F4E135E09C9898462FE24C5 matches the file, object 61620 B. Cursor blend warning is gone: the only such line in the boot is [3.681998], 4 ms before 'Initialized sm750hdmidrm 0.1.0' from the stale 0.5.9 probe; neither 0.6.0 probe emits it, and plane 40 exposes '42 pixel blend mode' Pre-multiplied=0. Register dump now works (49 registers, GAP-B4 CLOSED). Held-client 1024x768 vs 1920x1080 baseline changed 12 of 49 registers (PANEL_PLL_CTRL, PANEL_DISPLAY_CTRL, PANEL_FB_ADDRESS, PANEL_FB_WIDTH, PANEL_WINDOW_WIDTH, PANEL_WINDOW_HEIGHT, PANEL_PLANE_BR, PANEL_HORIZONTAL_TOTAL, PANEL_HORIZONTAL_SYNC, PANEL_VERTICAL_TOTAL, PANEL_VERTICAL_SYNC, PANEL_CURRENT_LINE); restored vs baseline differed in 3 of 49 (scanline counter, PANEL_FB_ADDRESS re-allocation, MISC_CTRL bit 17 0x01020060->0x01000060 which src/ddk750_reg.h does not name - recorded as an observation, not a defect); a 633-sample race control saw both timing sets (314 vs 319), so the 1-of-49 first attempt was a sampling artefact. GAP-B7 CLOS