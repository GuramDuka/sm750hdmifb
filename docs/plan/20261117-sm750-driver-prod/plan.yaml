  - "Normative path is the VERIFIED ROOTLESS method, not a fallback: dnf download libdrm libdrm-devel, rpm2cpio extraction, then PKG_CONFIG_PATH/PKG_CONFIG_SYSROOT_DIR/LD_LIBRARY_PATH. Reviewer verified make check exits 0 and the Makefile:14 check target is 17 recipe commands (measured, docs/evidence/baseline/13-make-check-count.txt), and JOBS=12 ./tests/build-all-kernels.sh exits 0 with 'Built 9 sm750hdmidrm kernel/format combinations'."
