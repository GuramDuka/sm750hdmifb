plan_id: 20261117-sm750-driver-prod
status: completed
tldr: |
  Stage 0-3 plan for the SM750 HDMI driver repo, revised to the VERIFIED ROOTLESS
  reality of this host. Planning discovery corrects three handoff premises: the repo is
  already an atomic DRM/KMS driver (module sm750hdmidrm, package sm750hdmifb 0.5.9,
  DKMS-installed for 7.3.3-100.fc43), the declared kernel floor is 6.17 (not 5.14), and
  the SM750 card is present and bound (01:00.0 126f:0750, card0-HDMI-A-1 connected) but
  not reachable for MMIO/modeset work without root. Privileges are NOT granted: sudo -n
  permits only dmidecode, ncu and nvprof, coder is in no video group, /dev/dri/card0
  denies open, dmesg and the PCI ROM are unreadable, and dkms/rpm install refuse to run.
  The normative method is therefore rootless: dnf download + rpm2cpio extraction for
  libdrm and kernel-devel, with PKG_CONFIG_PATH/PKG_CONFIG_SYSROOT_DIR/LD_LIBRARY_PATH.
  A separate privilege-upgrade path activates only if sudo is later granted.
  Real gaps are: no archived device specifications, no defect inventory, no recorded
  test strategy/results, and no rpmbuild spec (packaging today is .deb-only via
  build-package.sh). Waves: W1 spec archive + repo audit -> W2 rootless environment and
  readable baseline -> W3 surgical fixes and build matrix -> W4 test strategy/results +
  RPM/DKMS -> W5 docs index -> W6 independent acceptance review. Atomic DRM/KMS rewrite
  is out of scope.
