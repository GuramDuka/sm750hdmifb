ebugfs_create_dir left in src/, has_frame push, auto accepted, re-arm outside the region check guarded only by crc_enabled, values_cnt = 1, no ring/push/late_register symbols) with seven planted defects each rejected. Runtime result on 7.3.4-100 (srcversion 96DC3034FCB9A092269CE76): the root helper printed RESULT: scanout CRC check passed - control lists scanout, 12 stable entries 0xe20eea22, dump agreement offset 4147200 length 262144, content change black 0xe20eea22 vs white 0x06cf606c, monotonic nonzero bytes 0 then 262144 of 262144. Gates: check-crc-uapi, check-drm-policy, make check, check-release-version, check-drm-packaging, check-static, check-rpm-dkms and the 6.17.1-300 build all exit 0. Evidence: docs/evidence/scanout/09-crc-single-owner.txt. Version stays 0.6.0; the 0.6.1 bump stays deferred to an explicit owner decision."

