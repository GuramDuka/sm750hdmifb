plan_id: "20261127-sm750-strict-production"
objective: "Drive sm750hdmidrm to strict production in every respect: close A65 with a captured cause and a safe unload path, convert GAP-B8 into instrumented and soak-verified observation, deliver a 24-48 h soak with a machine-readable verdict, and issue an acceptance report written against the strict bar rather than the three-limitation bar the owner rejected."
acceptance_criteria:
  - "A65 carries either a captured stack naming the blocked function or an evidenced statement that no stack is obtainable with the exact error text, plus a named cause, plus a gate that fails when the driver-side remedy is removed."
  - "The unload path terminates within 5 s in ten consecutive cycles with the fbcon vtconsole bound on the installed build, with no task in D state, refcount back at 0, and the console still live."
  - "GAP-B8 reports attempt, retry, bus-recovery and final-failure counters readable by uid 1000 with no new privilege, and a written recurrence signature that a soak verdict can match."
  - "A soak of at least 24 h produced a machine-readable verdict of PASS, with zero new WARN/BUG/oops lines, zero wedge, and a panel that never lost its mode for more than 60 s."
  - "The acceptance report cites a file that exists under docs/evidence/ for every claim it makes, and gives a per-criterion verdict of PASS, GAP or OUT-OF-SCOPE with the reason."
  - "Every task appended its own docs/LOGBOOK.md entry in the same session, and git ls-remote origin refs/heads/main equals git rev-parse HEAD at the end of the run."
complexity: "HIGH"
status: "pending"
risk_signals:
  - "A65 validation cannot include a repeated wedge: each wedge costs an unbudgeted reboot, so the remedy must be validated by refusal or completion semantics that never enter the wedged state."
  - "The soak verdict depends on the monitor staying powered and on the host staying up for 24-48 h, which is an owner decision the plan cannot enforce."
  - "The B8 trigger measured 1 in 206 attempts, so 48 h of counters may legitimately read zero final failures; the recurrence definition must be time plus count based or the soak cannot claim coverage."
  - "Two privileged installs sit in this plan (0.6.11 then 0.6.12), so each install's srcversion must be recorded or the installed-code proof goes stale between waves."
  - "The IGT binary is not on PATH as igt-gpu-tools; regression claims must resolve the real test binaries rather than assume a package name."
  - "docs/evidence/runtime/54-a65-trace-mitigated-reload.txt already proves the sixteen marks on the mitigated path, so a reproduction that only repeats that path would not close A65."
critical_path:
  - "T1"
  - "T4"
  - "T7"
  - "T8"
  - "T9"
  - "T10"
  - "T12"
  - "T13"
  - "T14"
owner_blocked_tasks:
  - "T8 is owner-blocked: it needs a root write of a65_trace (or the one-time install of a trace helper), the owner present for the window, and the single granted reboot. Unblocked by the owner confirming the window, running the root command, and accepting a dark panel from the wedge until the reboot. A second reboot needs a fresh grant."
  - "T12 needs owner cooperation, not root: the host must stay up and the monitor powered for the soak, and no compositor, VT change or reboot may happen during it. Unblocked by the owner naming the 24-48 h window."
  - "T7, T11 and T9 are not owner-blocked: install, reload and unload all go through the existing allowlisted /usr/local/sbin/sm750-pkg and /usr/local/sbin/sm750-vt helpers."
created_at: "2026-11-27T22:55:00Z"
created_by: "gem-planner"
revision: 1
replan_count: 0
planner_revision_used: true
tldr: |
  The owner rejected "usable today with three documented limitations" and asked for
  strict production in every respect, with the bar fixed in advance: A65 root cause,
  a GAP-B8 recurrence analysis, and a day-long soak, on top of the gates that already
  pass. Discovery corrects two premises of the handoff. First, A65's instrumentation is
  no longer unexercised: docs/evidence/runtime/54-a65-trace-mitigated-reload.txt records
  all sixteen A65 marks in order on the helper-mitigated path, so what remains unrun is
  the deliberate unmitigated unload of docs/ROOT-ACTIONS.md:1834-1846, and the trace is
  already proven alive. Second, GAP-B8 already names its stage from 0.6.10 onward
  (docs/evidence/EVIDENCE-GAPS.md:746-769), so the gap is observation plus counting,
  not instrumentation design from zero.
  Shape: read-only analysis first (T1-T3), then instrumentation and helper work on trees
  that can be built and tested without the card (T4-T6), then one build and install
  (T7), then the single owner-gated event: reproduce A65 under trace, capture the stack,
  reboot exactly once, come back up (T8). Everything after the reboot is rootless and
  reversible: the remedy and its gate (T9), the fixed build installed (T11), regression
  breadth (T10), the soak (T12), the strict-bar report (T13), and the documentation and
  publish pass (T14). The critical path runs T1 -> T4 -> T7 -> T8 -> T9 -> T11 -> T12 ->
  T13 -> T14. A54 stays structural and is documented with its core-level proof; A53 stays
  an owner file; neither is claimed as fixed.
decisions:
  - "Waves are ordered analysis, instrumentation, install, one gated reboot event, remedy, install, regression, soak, report, publish, because the only irreversible step is the reboot and everything that can be decided without it is decided before it."
  - "T4 and T5 stay separate although both are gem-implementer work on src/sm750_drm.c, because T4 is S1 unload-path work and T5 is routine counter plumbing, and a merged retry would put the highest-risk change in the widest blast radius."
  - "The remedy is first shaped so the wedged state becomes impossible rather than merely diagnosable, because the plan has one reboot and a validation that wedges cannot be repeated."
  - "Version ladder 0.6.10 -> 0.6.11 (trace marks and counters) -> 0.6.12 (remedy), so each privileged install has its own srcversion and the installed-code proof is never inherited from a different build."
  - "A54 is recorded as a structural limit with the core-level citation, not as a driver defect and not as something to fix here: drm_client_funcs.restore is unreachable when open_count never reaches zero, proven in docs/evidence/runtime/51-lastclose-open-count.txt."
  - "A53 is an owner file under /etc/environment and is recorded as an owner action outside the driver's scope; no gate is written against it."
  - "Counter and soak sampling use only sysfs, /proc, /sys/module and the existing allowlisted helpers; no new privilege is invented and no console-grabbing path is used."
  - "Regression breadth is limited to what the host can actually do: make check, the release audit, the opt-in static gate, the KUnit DRM suites, five header trees and a rootless container build; every hardware-dependent claim is stated as out of scope with the missing hardware named."
  - "Wave 1 closed 2026-11-27T23:05Z: T1 (commit d4fe58c) ranked C1 console_sem inside drm_dev_unplug, C2 untimed workqueue flush, C3 sdev->mode_lock around sii902x shutdown, with the unload ordering contract T4 must implement; T2 (commit 3c35e7f) fixed the fifteen counter increment sites and the eleven 0444 attribute names, and proved the unprivileged reader is uid 1005 rather than the uid 1000 the task text says, so T5 must read as uid 1005."
assumptions:
  - "The owner either installs one new read-write trace helper through a ROOT-ACTIONS row or writes /sys/module/sm750hdmidrm/parameters/a65_trace himself before T8; both routes are acceptable and the plan does not depend on the first."
  - "The 6.17.1-300 header tree at /mega/tmp/sm750/t5/k617 survives; if it does not, the proven koji fetch and rpm2cpio extraction is repeated under /mega/tmp/sm750/."
  - "The monitor stays powered and the host stays up for the soak window, so hpd, rxsense and the raster samples are meaningful."
  - "podman runs rootless on this host and can pull a Fedora image; if the pull fails, the container row degrades to a recorded gap rather than blocking the plan."
  - "No compositor, VT switch or seat operation is needed anywhere in this plan; sm750-vt off and on detach and re-bind fbcon without touching the owner's VT."
