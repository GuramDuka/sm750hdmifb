# SPDX-License-Identifier: GPL-2.0-only
#
# INACTIVE CI RECIPE. GitHub Actions is disabled for this repository, so this
# file lives outside .github/workflows/ on purpose: GitHub only loads workflows
# from that directory, and any commit that creates or updates a file below it
# is rejected unless the pushing token carries the `workflow` scope.
#
# To re-enable: copy this file back to .github/workflows/build.yml, push with a
# token that has the `workflow` scope, and delete the "INACTIVE" note above.
# The release gates in tests/audit-release.sh, tests/check-drm-packaging.sh and
# tests/check-release-version.sh read this copy, so keep artifact names in sync.
name: Manual DKMS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Attach artifacts to an existing release tag
        required: true
        type: boolean
        default: false
      release_tag:
        description: Existing release tag, for example v0.5.1
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          headers_package=$(apt-cache search --names-only '^linux-headers-6\.17\.[0-9]+-[0-9]+-generic$' | awk '{print $1}' | sort -V | tail -1)
          test -n "$headers_package"
          sudo apt-get install -y build-essential dkms "$headers_package" libdrm-dev ripgrep

      - name: Select Ubuntu kernel headers
        id: headers
        run: |
          headers=$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-6.17.*-generic' | sort -V | tail -1)
          test -n "$headers"
          echo "path=$headers" >>"$GITHUB_OUTPUT"

      - name: Build and test
        run: make KDIR="${{ steps.headers.outputs.path }}" check

      - name: Build and audit package
        run: make KDIR="${{ steps.headers.outputs.path }}" check-package

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sm750hdmifb-0.6.11
          path: |
            dist/sm750hdmifb_0.6.11_all.deb
            dist/sm750hdmifb-tools_0.6.11_amd64.deb
            dist/sm750hdmifb-0.6.11-source.tar.gz
            dist/SHA256SUMS
            dist/RELEASE-AUDIT.txt

      - name: Attach to existing GitHub release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test -n "$RELEASE_TAG"
          gh release view "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" --clobber \
            dist/sm750hdmifb_0.6.11_all.deb \
            dist/sm750hdmifb-tools_0.6.11_amd64.deb \
            dist/sm750hdmifb-0.6.11-source.tar.gz \
            dist/SHA256SUMS \
            dist/RELEASE-AUDIT.txt
